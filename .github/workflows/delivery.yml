name: delivery
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  components:
    name: Component / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: member3
            lock: member3/requirements.txt
            tests: tests/member3
          - component: member4
            lock: member4/requirements.txt
            tests: tests/member4 tests/identity/test_auth.py tests/identity/test_browser.py
          - component: copilot
            lock: copilot/requirements.txt
            tests: tests/copilot
          - component: observability
            lock: member2/requirements-test.txt
            extra_lock: observability/requirements.txt
            tests: tests/observability
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - name: Install the component lock
        env:
          LOCK: ${{ matrix.lock }}
          EXTRA_LOCK: ${{ matrix.extra_lock }}
        run: |
          python -m venv .venv
          python -m venv .tools/component
          requirements=(-r "$LOCK")
          if [ -n "$EXTRA_LOCK" ]; then requirements+=(-r "$EXTRA_LOCK"); fi
          .tools/component/bin/python -m pip install --only-binary=:all: --require-hashes "${requirements[@]}"
          .tools/component/bin/python -m pip check
      - name: Generate the gRPC bindings
        if: matrix.component == 'member3' || matrix.component == 'member4'
        run: |
          .venv/bin/python -m venv .tools/contracts-venv
          .tools/contracts-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-contracts.txt
          make bindings
      - name: Start the local Kafka and PostgreSQL fixture dependencies
        if: matrix.component == 'member3' || matrix.component == 'member4'
        run: make infra-up
      - name: Test the isolated component
        env:
          TESTS: ${{ matrix.tests }}
          MEMBER3_TEST_DSN: postgresql://control:control_disposable@127.0.0.1:15432/local_dev_control
          MEMBER4_TEST_DSN: postgresql://projection:projection_disposable@127.0.0.1:15432/local_dev_projection
          MEMBER4_TEST_KAFKA: 127.0.0.1:19092
        run: .tools/component/bin/python -m pytest -q $TESTS
      - name: Clean up disposable dependencies
        if: always() && (matrix.component == 'member3' || matrix.component == 'member4')
        run: make infra-reset CONFIRM=smart-grid-local-dev

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - name: Fixture UI and deterministic Investigator in Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .tools/playwright
        run: |
          python -m venv .tools/dashboard-test-venv
          .tools/dashboard-test-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r dashboard/requirements-test.txt
          .tools/dashboard-test-venv/bin/python -m playwright install chromium
          make dashboard-test

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - name: Install the locked renderer and contract tools
        run: |
          python -m venv .venv
          python -m venv .tools/contracts-venv
          .tools/contracts-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-contracts.txt
          mkdir -p .tools/downloads
          curl -fsSL https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl -o .venv/bin/kubectl
          echo 'cfda68cba5848bc3b6c6135ae2f20ba2c78de20059f68789c090166d6abc3e2ca .venv/bin/kubectl' | sha256sum -c -
          chmod +x .venv/bin/kubectl
          curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o .tools/downloads/helm.tgz
          echo '7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496 .tools/downloads/helm.tgz' | sha256sum -c -
          tar -xOf .tools/downloads/helm.tgz linux-amd64/helm > .venv/bin/helm
          chmod +x .venv/bin/helm
      - name: Render and validate deployment packaging
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then git diff --check "$DIFF_BASE" HEAD; fi
          make delivery-render
          .tools/contracts-venv/bin/python -m pytest -q tests/test_kind_local.py tests/test_delivery.py
      - name: Build all deployable project-owned images
        run: make delivery-images
      - name: Scan pinned locks and images and generate SBOMs
        run: make delivery-scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: delivery-checks
          retention-days: 7
          include-hidden-files: true
          path: |
            .tools/delivery-checks/manifests
            .tools/delivery-checks/scans/dependencies.json
            .tools/delivery-checks/scans/secrets.json
            .tools/delivery-checks/scans/*.vulnerabilities.json
            .tools/delivery-checks/scans/*.sbom.json
            .tools/delivery-images/images.json
