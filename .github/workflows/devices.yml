name: devices
on:
  push:
    paths: ['devices/**', 'schemas/**', 'tests/devices/**', 'tests/contracts/**', 'infra/compose/**', 'Makefile', '.github/workflows/devices.yml']
  pull_request:
    paths: ['devices/**', 'schemas/**', 'tests/devices/**', 'tests/contracts/**', 'infra/compose/**', 'Makefile', '.github/workflows/devices.yml']
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - name: Isolated Python tools
        run: |
          python -m venv .venv
          .venv/bin/python -m venv .tools/contracts-venv
          .tools/contracts-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-contracts.txt
          .venv/bin/python -m venv .tools/devices-venv
          .tools/devices-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r devices/requirements.txt
          .tools/devices-venv/bin/python -m pip check
      - run: make devices-test
      - run: make infra-up
      - run: make devices-live
      - run: make devices-build
      - if: always()
        run: make infra-down
