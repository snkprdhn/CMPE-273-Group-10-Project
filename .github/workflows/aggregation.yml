name: aggregation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - name: Isolated pure aggregation checks
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r aggregation/requirements-test.txt
          make aggregation-test
