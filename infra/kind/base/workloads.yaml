apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {grid-owner: Member_4, grid-stage: apps, grid-app: keycloak}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {grid-app: keycloak}
  template:
    metadata:
      labels: {grid-app: keycloak, grid-owner: Member_4}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext: {runAsUser: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.4@sha256:044a457e04987e1fff756be3d2fa325a4ef420fa356b7034ecc9f1b693c32761
          args: [start-dev, --import-realm, --http-port=8080, --hostname=http://127.0.0.1:18086]
          envFrom:
            - configMapRef: {name: telemetry-runtime}
            - secretRef: {name: keycloak-runtime}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: 'jdbc:postgresql://postgres:5432/local_dev_keycloak'}
            - {name: KC_DB_USERNAME, value: keycloak}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: JAVA_OPTS_KC_HEAP, value: "-Xms128m -Xmx384m"}
          ports:
            - {name: oidc, containerPort: 8080}
            - {name: health, containerPort: 9000}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /health/started, port: health}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 10}
      volumes:
        - name: realm
          secret: {secretName: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {grid-owner: Member_4, grid-stage: apps}
spec:
  selector: {grid-app: keycloak}
  ports:
    - {name: oidc, port: 8080}
