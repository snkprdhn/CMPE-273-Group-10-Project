apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-runtime
  labels: {grid-owner: Member_1, grid-stage: apps}
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel.observability:4318
  GRID_ENVIRONMENT: local-kind
  GRID_TRANSFORMERS: tx-001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels: {grid-owner: Member_1, grid-stage: apps, grid-app: registry}
spec:
  replicas: 1
  selector:
    matchLabels: {grid-app: registry}
  template:
    metadata:
      labels: {grid-app: registry, grid-owner: Member_1}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: registry
          image: smart-grid-kind/registry:v1
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: telemetry-runtime}
            - secretRef: {name: registry-runtime}
          ports:
            - {name: http, containerPort: 8001}
            - {name: grpc, containerPort: 50051}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: temp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /healthz, port: 8001}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /readyz, port: 8001}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8001}
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - {name: temp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels: {grid-owner: Member_1, grid-stage: apps}
spec:
  selector: {grid-app: registry}
  ports:
    - {name: grpc, port: 50051}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: action
  labels: {grid-owner: Member_3, grid-stage: apps, grid-app: action}
spec:
  replicas: 1
  selector:
    matchLabels: {grid-app: action}
  template:
    metadata:
      labels: {grid-app: action, grid-owner: Member_3}
    spec:
      serviceAccountName: action
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: action
          image: smart-grid-kind/action:v1
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: telemetry-runtime}
            - secretRef: {name: action-runtime}
          env:
            - {name: KAFKA_PREFIX, value: "integration-kind."}
            - {name: KAFKA_BOOTSTRAP, value: "grid-kafka-bootstrap:9092"}
            - {name: LEASE_NAMESPACE, value: "platform"}
            - {name: REGISTRY_ADDRESS, value: "registry:50051"}
            - {name: WORKER_HEALTH_FILE, value: "/tmp/worker-live"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: temp, mountPath: /tmp}
          startupProbe:
            exec:
              command: ["/opt/venv/bin/python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-live').stat().st_mtime < 30"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/opt/venv/bin/python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-live').stat().st_mtime < 10"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/opt/venv/bin/python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-live').stat().st_mtime < 30"]
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - {name: temp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection
  labels: {grid-owner: Member_4, grid-stage: apps, grid-app: projection}
spec:
  replicas: 1
  selector:
    matchLabels: {grid-app: projection}
  template:
    metadata:
      labels: {grid-app: projection, grid-owner: Member_4}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: projection
          image: smart-grid-kind/api:v1
          imagePullPolicy: Never
          args: ["consume"]
          envFrom:
            - configMapRef: {name: telemetry-runtime}
            - secretRef: {name: projection-runtime}
          env:
            - {name: KAFKA_PREFIX, value: "integration-kind."}
            - {name: KAFKA_BOOTSTRAP, value: "grid-kafka-bootstrap:9092"}
            - {name: PROJECTION_GROUP, value: "integration-kind.projection"}
            - {name: WORKER_HEALTH_FILE, value: "/tmp/worker-live"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: temp, mountPath: /tmp}
          startupProbe:
            exec:
              command: ["/opt/venv/bin/python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-live').stat().st_mtime < 30"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/opt/venv/bin/python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-live').stat().st_mtime < 10"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/opt/venv/bin/python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-live').stat().st_mtime < 30"]
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - {name: temp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {grid-owner: Member_4, grid-stage: apps, grid-app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {grid-app: api}
  template:
    metadata:
      labels: {grid-app: api, grid-owner: Member_4}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: smart-grid-kind/api:v1
          imagePullPolicy: Never
          args: ["serve", "--bind", "0.0.0.0"]
          envFrom:
            - configMapRef: {name: telemetry-runtime}
            - secretRef: {name: projection-runtime}
          env:
            - {name: GRID_LOCAL_KIND, value: "1"}
          ports:
            - {name: http, containerPort: 18084}
          resources:
            requests: {cpu: 50m, memory: 160Mi}
            limits: {cpu: 600m, memory: 320Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: temp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /api/v1/health, port: 18084}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/v1/ready, port: 18084}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 18084}
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - {name: temp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {grid-owner: Member_4, grid-stage: apps}
spec:
  selector: {grid-app: api}
  ports:
    - {name: http, port: 18084}
---
