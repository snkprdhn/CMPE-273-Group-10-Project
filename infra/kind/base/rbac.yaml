apiVersion: v1
kind: ServiceAccount
metadata:
  name: action
  labels: {grid-stage: policy}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: action
  labels: {grid-stage: policy}
spec:
  leaseDurationSeconds: 15
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: action-lease
  labels: {grid-stage: policy}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [action]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: action-lease
  labels: {grid-stage: policy}
subjects:
  - {kind: ServiceAccount, name: action}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: action-lease}
