apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../base, disruption.yaml]
patches:
  - target: {kind: KafkaNodePool, name: brokers}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: {kind: Kafka, name: grid}
    patch: |-
      - op: replace
        path: /spec/kafka/config
        value:
          auto.create.topics.enable: false
          num.partitions: 3
          log.retention.hours: 24
          default.replication.factor: 3
          min.insync.replicas: 2
          offsets.topic.replication.factor: 3
          transaction.state.log.replication.factor: 3
          transaction.state.log.min.isr: 2
          transaction.max.timeout.ms: 900000
  - target: {kind: KafkaTopic, labelSelector: grid-owner=Member_2}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/config/min.insync.replicas
        value: 2
  - target: {kind: KafkaConnect, name: grid-connect}
    patch: |-
      - op: replace
        path: /spec/config/config.storage.replication.factor
        value: 3
      - op: replace
        path: /spec/config/offset.storage.replication.factor
        value: 3
      - op: replace
        path: /spec/config/status.storage.replication.factor
        value: 3
  - target: {kind: Deployment, name: (action|api|registry)}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: FlinkDeployment, name: aggregation}
    patch: |-
      - op: replace
        path: /spec/taskManager/replicas
        value: 2
