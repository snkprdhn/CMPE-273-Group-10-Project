# Local CDC only. Reuses running dependencies; no simulator/Flink restarts.
services:
  connect:
    image: smart-grid-local-dev/member3-connect:3.0.8-v1
    build:
      context: ../..
      dockerfile: infra/member3/Dockerfile.connect
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - '127.0.0.1:18083:8083'
    mem_limit: 768m
    stop_grace_period: 30s
