services:
  jobmanager:
    image: smart-grid-local-dev/member2:v1
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 768m
    volumes:
      - checkpoints:/checkpoints
      - ../../member2:/app/member2:ro
      - ../../observability:/app/observability:ro
      - ../../tests/member2:/app/tests/member2:ro
    mem_limit: 1g
    networks: [default, broker]
  taskmanager:
    image: smart-grid-local-dev/member2:v1
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1536m
        taskmanager.memory.task.off-heap.size: 256m
        taskmanager.memory.managed.size: 128m
        python.executable: /opt/venv/bin/python
    volumes:
      - checkpoints:/checkpoints
      - ../../member2:/app/member2:ro
      - ../../observability:/app/observability:ro
    mem_limit: 2g
    networks: [default, broker]
networks:
  broker:
    external: true
    name: smart-grid-local-dev_default
volumes:
  checkpoints:
