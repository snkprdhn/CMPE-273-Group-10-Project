apiVersion: v1
kind: Namespace
metadata:
  name: smart-grid-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: action
  namespace: smart-grid-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: action-lease
  namespace: smart-grid-control
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [action]
    verbs: [get, update]
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: action
  namespace: smart-grid-control
spec:
  leaseDurationSeconds: 15
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: action-lease
  namespace: smart-grid-control
subjects:
  - kind: ServiceAccount
    name: action
    namespace: smart-grid-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: action-lease
