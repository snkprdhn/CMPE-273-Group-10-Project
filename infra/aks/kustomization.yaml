apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../hosted, edge.yaml, benchmark-policies.yaml, fleet.yaml]
patches:
  # ── Storage: use AKS Standard SSD for Kafka and checkpoint PVCs ──────────────
  - target: {kind: KafkaNodePool, name: brokers}
    patch: |-
      - op: add
        path: /spec/storage/volumes/0/class
        value: grid-ssd
  - target: {kind: PersistentVolumeClaim, name: 'checkpoints|copilot-audit'}
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: grid-ssd

  # ── Image pull: ACR images are pre-pulled, use IfNotPresent ──────────────────
  - target: {kind: Deployment, name: 'registry|action|projection|api|copilot|ui'}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: Job, name: 'database-bootstrap|simulator'}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: FlinkDeployment, name: aggregation}
    patch: |-
      - op: replace
        path: /spec/imagePullPolicy
        value: IfNotPresent

  # ── Task 2: Disable Keycloak — auth replaced by mock identity mode ────────────
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # ── Task 2: Disable Tempo — tracing secondary to metrics for the demo ─────────
  - target: {kind: Deployment, name: tempo}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # ── Task 2: API — switch to mock identity mode, remove Keycloak secret ref ────
  - target: {kind: Deployment, name: api}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AUTH_MODE
          value: mock
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MOCK_IDENTITIES
          valueFrom:
            secretKeyRef: {name: mock-identity-runtime, key: MOCK_IDENTITIES}

  # ── Task 2: UI — mock auth mode, system health env vars, remove demo secret ───
  - target: {kind: Deployment, name: ui}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AUTH_MODE
          value: mock
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_API_TOKEN
          valueFrom:
            secretKeyRef: {name: mock-identity-runtime, key: DASHBOARD_API_TOKEN}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROMETHEUS_URL
          value: http://monitoring-prometheus.observability:9090
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FLINK_REST_URL
          value: http://aggregation-rest:8081
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GRAFANA_URL
          value: http://monitoring-grafana.observability:80
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: DASHBOARD_HOME, value: live}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: GRAFANA_PUBLIC_PATH, value: /grafana/}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: FLEET_API_URL, value: "http://api:18084/api/v1"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: FLEET_CONTROL_URL, value: "http://fleet:8003"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FLEET_CONTROL_TOKEN
          valueFrom:
            secretKeyRef: {name: fleet-control, key: token}
      # No Investigator on the AKS demo: an empty value hides every Investigate button.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: COPILOT_URL, value: ""}

  # ── Flink: keyed by transformer, bounded state, two subtasks on the dedicated node ─────────
  # JobManager and TaskManager share the Flink node (taint grid-role=flink): the ReadWriteOnce
  # checkpoint disk can attach to one node only.
  - target: {kind: FlinkDeployment, name: aggregation}
    patch: |-
      - op: replace
        path: /spec/job/parallelism
        value: 2
      - op: replace
        path: /spec/flinkConfiguration/execution.checkpointing.dir
        value: file:///checkpoints/integration-kind
      - op: add
        path: /spec/flinkConfiguration/execution.checkpointing.interval
        value: "2000"
      - op: replace
        path: /spec/flinkConfiguration/taskmanager.numberOfTaskSlots
        value: "2"
      - op: replace
        path: /spec/flinkConfiguration/taskmanager.memory.managed.size
        value: 384m
      - op: replace
        path: /spec/taskManager/resource/cpu
        value: 1.3
      - op: replace
        path: /spec/taskManager/resource/memory
        value: 3200m
      - op: replace
        path: /spec/jobManager/resource/cpu
        value: 0.25
      - op: replace
        path: /spec/jobManager/resource/memory
        value: 896m
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: GRID_TRANSFORMERS
          value: tx-001,tx-002,tx-003,tx-004,tx-005,tx-006,tx-007,tx-008,tx-009,tx-010,tx-011,tx-012,tx-013,tx-014,tx-015,tx-016,tx-017,tx-018,tx-019,tx-020,tx-021,tx-022,tx-023,tx-024,tx-025
      - op: replace
        path: /spec/job/args
        value:
          - -py
          - /app/aggregation/job.py
          - --run
          - fleet-v1
          - --bootstrap
          - grid-kafka-bootstrap:9092
          - --prefix
          - integration-kind.
          - --topology
          - /app/aggregation/fleet-topology.json
          - --checkpoint
          - file:///checkpoints/integration-kind
          - --checkpoint-ms
          - "2000"
          - --parallelism
          - "2"
          - --startup
          - group-offsets
      - op: add
        path: /spec/podTemplate/spec/tolerations
        value:
          - key: grid-role
            operator: Equal
            value: flink
            effect: NoSchedule
      - op: add
        path: /spec/podTemplate/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: grid-role
                      operator: In
                      values: [flink]

  # The broker volume grows to 8 GiB so the telemetry window is three hours rather than the size cap.
  - target: {kind: ConfigMap, name: telemetry-runtime}
    patch: |-
      - op: replace
        path: /data/GRID_TRANSFORMERS
        value: tx-001,tx-002,tx-003,tx-004,tx-005,tx-006,tx-007,tx-008,tx-009,tx-010,tx-011,tx-012,tx-013,tx-014,tx-015,tx-016,tx-017,tx-018,tx-019,tx-020,tx-021,tx-022,tx-023,tx-024,tx-025
  - target: {kind: KafkaNodePool, name: brokers}
    patch: |-
      - op: replace
        path: /spec/storage/volumes/0/size
        value: 8Gi
      # 2026-11-27: a 384m heap hit OutOfMemoryError (transactional producer state from Flink's
      # 2 s checkpoints plus ~3 h of segments). The JVM hung instead of exiting, so Kubernetes
      # never restarted it. Larger heap, and exit on OOM so the container restarts.
      - op: replace
        path: /spec/resources/limits/memory
        value: 1536Mi
      - op: replace
        path: /spec/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/jvmOptions/-Xms
        value: 768m
      - op: replace
        path: /spec/jvmOptions/-Xmx
        value: 768m
      - op: add
        path: /spec/jvmOptions/-XX
        value: {ExitOnOutOfMemoryError: "true"}

  # ── Rolling data: three hours, with a size cap per partition as a backstop ───────────────
  # Kafka only deletes closed segments, so segments are small and roll every ten minutes.
  - target: {kind: KafkaTopic}
    patch: |-
      - op: add
        path: /spec/config/segment.ms
        value: 600000
      - op: add
        path: /spec/config/segment.bytes
        value: 8388608
      - op: add
        path: /spec/config/retention.bytes
        value: 25165824
  - target: {kind: KafkaTopic, name: telemetry}
    patch: |-
      - op: replace
        path: /spec/config/segment.bytes
        value: 33554432
      - op: replace
        path: /spec/config/retention.bytes
        value: 1073741824
  - target: {kind: KafkaTopic, name: transformer-load}
    patch: |-
      - op: replace
        path: /spec/config/segment.bytes
        value: 16777216
      - op: replace
        path: /spec/config/retention.bytes
        value: 134217728

  # ── Control scope: the closed loop manages five hero transformers; the rest are observed only ──
  - target: {kind: Deployment, name: action}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CONTROL_TRANSFORMERS, value: "tx-001,tx-002,tx-003,tx-004,tx-005"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: ACTION_AUTO_COMPENSATE, value: "1"}
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
  # Both workers store managed inventory only. The control worker prunes to the configured window.
  - target: {kind: Deployment, name: projection}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/1/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PROJECTION_SCOPE, value: context}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PROJECTION_WINDOW_MINUTES, value: "15"}
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 320Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 600m
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value: {name: PROJECTION_SCOPE, value: context}
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value: {name: PROJECTION_FRESH_SECONDS, value: "30"}
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/memory
        value: 192Mi
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/cpu
        value: 400m

  # Windows close ten seconds late and the alert for a window trails its load, so a 15 s freshness limit flickers.
  - target: {kind: Deployment, name: 'api|projection'}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PROJECTION_FRESH_SECONDS, value: "30"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PROJECTION_ALERT_GRACE_SECONDS, value: "8"}

  # ── Task 2: Remove keycloak from postgres-ingress allowed sources ─────────────
  # Keycloak is scaled to 0; its NetworkPolicy allowance is also removed to keep
  # the policy consistent with the running workloads.
  - target: {kind: NetworkPolicy, name: postgres-ingress}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchExpressions/0/values
        value: [database-bootstrap, registry, connect, action, projection, api, simulator]
  - target: {kind: NetworkPolicy, name: postgres-clients}
    patch: |-
      - op: replace
        path: /spec/podSelector/matchExpressions/0/values
        value: [database-bootstrap, registry, connect, action, projection, api, simulator]
